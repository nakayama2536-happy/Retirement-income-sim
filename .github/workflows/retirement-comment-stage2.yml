name: Retirement comment stage2 (isolated candidate)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/retirement-comment/**'
      - 'tools/browser-test/retirement-comment-ui-check.mjs'
      - '.github/workflows/retirement-comment-stage2.yml'
permissions:
  contents: read
concurrency:
  group: retirement-comment-stage2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact public source before staging
        run: |
          mkdir -p stage2-evidence
          git archive --format=zip HEAD > stage2-evidence/public-source-before.zip
          git rev-parse HEAD > stage2-evidence/source-commit.txt
      - name: Apply guarded comment candidate only inside this disposable checkout
        run: |
          node tools/retirement-comment/stage2.mjs
          node --check retirement-comment.mjs
          node --check detail-settings.mjs
          node --check detail-ui.mjs
          git diff --check
      - name: Real save undo backup and calculation invariance tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/retirement-comment/test_integration.mjs test_detail_settings.mjs | tee stage2-evidence/node.tap
      - name: Install existing pinned browser dependency
        working-directory: tools/browser-test
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        working-directory: tools/browser-test
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise actual application UI with fictional state only
        run: node tools/browser-test/retirement-comment-ui-check.mjs
      - name: Package candidate evidence, not deployment assets
        if: always()
        shell: bash
        run: |
          git diff --binary > stage2-evidence/candidate.patch
          if [ -f retirement-comment.mjs ]; then
            git diff --no-index --binary /dev/null retirement-comment.mjs >> stage2-evidence/candidate.patch || test "$?" = 1
          fi
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path('.')
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          files=[p for p in files if p]+(['retirement-comment.mjs'] if root.joinpath('retirement-comment.mjs').is_file() else [])
          manifest=[]
          with zipfile.ZipFile('stage2-evidence/staged-source-NOT-FOR-DEPLOYMENT.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(set(files)):
                  data=root.joinpath(name).read_bytes();z.writestr(name,data)
                  manifest.append({'path':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              z.writestr('STAGE2_NOT_FOR_DEPLOYMENT.txt','Isolated integration candidate. Runtime identity, manifest, Service Worker packaging and production approval are pending. No personal data or Firebase operations.\n')
          root.joinpath('stage2-evidence/source-hashes.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retirement-comment-stage2-evidence
          path: stage2-evidence/
          if-no-files-found: error
          retention-days: 14
