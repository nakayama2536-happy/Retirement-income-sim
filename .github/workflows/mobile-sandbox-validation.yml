name: Mobile sandbox diagnostic (no cloud)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/firebase-mobile/**'
      - 'tools/firebase-emulator/encrypted-sandbox-check.mjs'
      - 'sync-crypto.mjs'
      - 'test_sync_mobile.mjs'
      - 'test_sync_mobile_config_compat.mjs'
      - 'test_sync_preview_approval.mjs'
      - 'tools/browser-test/mobile-sandbox-ui-check.mjs'
      - '.github/workflows/mobile-sandbox-validation.yml'
permissions:
  contents: read
concurrency:
  group: mobile-sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mobile-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mobile policy and fourteen-day preview approval
        run: node --test test_sync_mobile.mjs test_sync_preview_approval.mjs test_sync_mobile_config_compat.mjs
      - name: Install existing pinned browser dependency
        working-directory: tools/browser-test
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install isolated Chromium and WebKit
        working-directory: tools/browser-test
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Test mobile HTTPS fixture with mocked Firebase only
        run: node tools/browser-test/mobile-sandbox-ui-check.mjs
      - name: Repeat mobile checks with no appId in Hosting config
        env:
          MOBILE_CONFIG_VARIANT: without-app-id
        run: node tools/browser-test/mobile-sandbox-ui-check.mjs
      - name: Build correction candidate without deployment or expiry changes
        run: |
          node tools/firebase-mobile/prepare.mjs "$RUNNER_TEMP/lifeplan-mobile-preview-candidate"
          cp docs/SYNC_CONFIG_COMPAT_20261021.md "$RUNNER_TEMP/lifeplan-mobile-preview-candidate/READ_BEFORE_UPDATE.md"
      - name: Retain reviewed package for authenticated deployment
        uses: actions/upload-artifact@v4
        with:
          name: mobile-config-compat-candidate-no-deploy
          path: ${{ runner.temp }}/lifeplan-mobile-preview-candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Keep synthetic mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-sandbox-evidence
          path: tools/browser-test/mobile-results/
          if-no-files-found: warn
          retention-days: 7
