name: Isolated browser validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record exact PR head used for update and restore checks
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          mkdir -p tools/browser-test/browser-results
          git rev-parse HEAD > tools/browser-test/browser-results/source-commit.txt
          git rev-parse HEAD^{tree} > tools/browser-test/browser-results/source-tree.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependency
        working-directory: tools/browser-test
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Install test browser
        working-directory: tools/browser-test
        run: npx --no-install playwright install --with-deps chromium
      - name: Prepare public application fixture
        run: node tools/browser-test/prepare.mjs
      - name: Exercise update failures and corresponding backup restore
        run: node tools/browser-test/run-browser.mjs
      - name: Verify encrypted diagnostic UI without real Firebase access
        run: node tools/browser-test/encrypted-sandbox-ui-check.mjs
      - name: Keep synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-evidence
          path: tools/browser-test/browser-results/
          if-no-files-found: warn
          retention-days: 7
