name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and public-data guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          set -euo pipefail
          for file in *.mjs; do
            node --check "$file"
          done

      - name: Full application regression suite
        run: |
          set -euo pipefail
          for file in test_*.mjs; do
            # The pre-I-09 CSV test targets the retired v0.9 module graph;
            # annual CSV regression is covered by test_annual_csv.mjs.
            if [ "$file" = "test_csv_export.mjs" ]; then
              continue
            fi
            node --test "$file"
          done

      - name: Prevent private files in public repository
        shell: bash
        run: |
          set -euo pipefail

          tracked="$(git ls-files)"
          forbidden="$(
            printf '%s\n' "$tracked" |
              grep -E '(^|/)(personal_config[^/]*\.json|user_config[^/]*\.json|[^/]*\.private\.json|retirement-plan-full[^/]*\.json|retirement-plan-backup[^/]*\.json|full_backup\.json|master_snapshot\.json|annual_cashflow\.csv|\.env(\..*)?|[^/]*\.(key|pem|p12|pfx))$|^(10_master|20_requirements|30_validation|40_exports|50_reference_notes|99_inbox|private|personal|_private|secrets|private_exports|private_screenshots)(/|$)' ||
              true
          )"

          if [ -n "$forbidden" ]; then
            echo "::error::Public repository contains files that belong in Private GitHub or GitHub-external storage."
            printf '%s\n' "$forbidden"
            exit 1
          fi

          echo "Public-data guard passed."
