name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and public-data guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check app.mjs
          node --check calc.mjs
          node --check cashflow.mjs
          node --check csv-export.mjs
          node --check rules.mjs
          node --check storage.mjs
          node --check sw.js

      - name: Calculation regression tests
        run: node test_calc.mjs

      - name: CSV export regression tests
        run: node test_csv_export.mjs

      - name: PWA static asset smoke test
        run: node test_pwa_assets.mjs

      - name: Prevent private files in public repository
        shell: bash
        run: |
          set -euo pipefail

          tracked="$(git ls-files)"
          forbidden="$(
            printf '%s\n' "$tracked" |
              grep -E '(^|/)(personal_config[^/]*\.json|user_config[^/]*\.json|[^/]*\.private\.json|retirement-plan-full[^/]*\.json|retirement-plan-backup[^/]*\.json|full_backup\.json|master_snapshot\.json|annual_cashflow\.csv|\.env(\..*)?|[^/]*\.(key|pem|p12|pfx))$|^(10_master|20_requirements|30_validation|40_exports|50_reference_notes|99_inbox|private|personal|_private|secrets|private_exports|private_screenshots)(/|$)' ||
              true
          )"

          if [ -n "$forbidden" ]; then
            echo "::error::Public repository contains files that belong in Private GitHub or GitHub-external storage."
            printf '%s\n' "$forbidden"
            exit 1
          fi

          echo "Public-data guard passed."
