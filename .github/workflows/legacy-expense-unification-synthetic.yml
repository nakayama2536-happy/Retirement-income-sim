name: Legacy expense unification synthetic integration (draft only)
on:
  pull_request:
    paths:
      - 'lifeplan-expense-*.mjs'
      - 'expense-unification-*.mjs'
      - 'apply-expense-unification-coverage.mjs'
      - 'apply-expense-unification-review*.mjs'
      - 'tools/stage-expense-unification-release.mjs'
      - 'lifeplan-unification-*.mjs'
      - 'run-lifeplan-unification-integration*.mjs'
      - 'test_unification_actual_engine.mjs'
      - 'test_unification_adoption_engine.mjs'
      - 'lifeplan-expense-unification-adoption-ui.mjs'
      - 'apply-expense-unification-adoption-ui.mjs'
      - '.github/workflows/legacy-expense-unification-synthetic.yml'
permissions:
  contents: read
jobs:
  isolated-synthetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate code (no token persisted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standalone synthetic guard and migration tests
        run: node --test lifeplan-expense-migration-preflight.test.mjs lifeplan-expense-unification-candidate.test.mjs lifeplan-expense-unification-adoption.test.mjs lifeplan-expense-unification-transaction.test.mjs lifeplan-expense-unification-review.test.mjs apply-expense-unification-review.test.mjs expense-unification-coverage.test.mjs run-lifeplan-unification-integration.test.mjs lifeplan-unification-equivalence.test.mjs
      - name: Verify original publish manifest (unmodified source only)
        run: node --test test_release_identity.mjs
      - name: Isolated actual-engine regression using pinned main source
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          trap 'git worktree remove --force "$temp" >/dev/null 2>&1 || true; rm -rf "$temp"' EXIT
          git worktree add --detach "$temp" 3de8df5465b1484028bd7d1b1d9db7ddbf9df81a
          node run-lifeplan-unification-integration.mjs "$temp"
          node apply-expense-unification-review.mjs "$temp"
          node --check "$temp/app.mjs"
          node --check "$temp/ui-numbering.mjs"
          grep -F "4-1-6" "$temp/ui-numbering.mjs"
          grep -F "mountExpenseUnificationReview" "$temp/app.mjs"
          node --check "$temp/lifeplan-expense-unification-review.mjs"
      - name: Chromium acceptance of isolated 4-1-6 review
        shell: bash
        run: |
          set -euo pipefail
          cd tools/browser-test
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
          cd ../..
          temp="$(mktemp -d)"
          trap 'git worktree remove --force "$temp" >/dev/null 2>&1 || true; rm -rf "$temp"' EXIT
          git worktree add --detach "$temp" 3de8df5465b1484028bd7d1b1d9db7ddbf9df81a
          node apply-expense-unification-review.mjs "$temp"
          node tools/browser-test/legacy-expense-staged-browser.mjs "$temp"
          node apply-expense-unification-adoption-ui.mjs "$temp"
          node --check "$temp/app.mjs"
          node --check "$temp/backup-compatibility.mjs"
          node tools/browser-test/legacy-expense-adoption-browser.mjs "$temp"
      - name: Package unpublished candidate and validate distribution in isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          source_checkout="$(mktemp -d)"
          candidate_checkout="${RUNNER_TEMP}/lifeplan-unification-staged"
          distribution="${RUNNER_TEMP}/lifeplan-unification-public"
          trap 'git worktree remove --force "$source_checkout" >/dev/null 2>&1 || true; rm -rf "$source_checkout"' EXIT
          git worktree add --detach "$source_checkout" 3de8df5465b1484028bd7d1b1d9db7ddbf9df81a
          node tools/stage-expense-unification-release.mjs "$source_checkout" "$candidate_checkout"
          node "$candidate_checkout/tools/package-public.mjs" "$candidate_checkout" "$distribution"
          node --test "$candidate_checkout/test_release_identity.mjs"
          node tools/browser-test/legacy-expense-adoption-browser.mjs "$distribution"
          test -f "$distribution/expense-unification-coverage.mjs"
          test -f "$distribution/lifeplan-expense-unification-adoption-ui.mjs"
      - name: Keep synthetic-only unpublished distribution as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: unification-staged-only-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/lifeplan-unification-public/
          if-no-files-found: error
          retention-days: 7

